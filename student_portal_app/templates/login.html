{% extends "base.html" %}
{% block title %}Вход — Student Portal{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-box">
        <div class="auth-box-header">
            <h1>STUDENT<span style="color:#d4a017;">PORTAL</span></h1>
            <p>Вход в систему</p>
        </div>
        <div class="auth-box-body">
            <form method="POST">
                <div class="form-group">
                    <label class="form-label">Логин</label>
                    <input type="text" name="username" class="form-control" placeholder="Введите логин" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;">Войти</button>
            </form>
        </div>
        <div class="auth-box-footer">
            Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
        </div>
    </div>
</div>
{% endblock %}
