{% extends "base.html" %}
{% block title %}Регистрация — Student Portal{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-box">
        <div class="auth-box-header">
            <h1>STUDENT<span style="color:#d4a017;">PORTAL</span></h1>
            <p>Регистрация нового пользователя</p>
        </div>
        <div class="auth-box-body">
            <form method="POST">
                <div class="form-group">
                    <label class="form-label">Логин *</label>
                    <input type="text" name="username" class="form-control" placeholder="Придумайте логин" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль *</label>
                    <input type="password" name="password" class="form-control" placeholder="Придумайте пароль" required>
                </div>
                <div class="form-group">
                    <label class="form-label">ФИО *</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Иванов Иван Иванович" required>
                </div>
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Группа</label>
                    <select name="group_id" class="form-control">
                        <option value="">— Не указана —</option>
                        {% for g in groups %}
                        <option value="{{ g.id }}">{{ g.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;">Зарегистрироваться</button>
            </form>
        </div>
        <div class="auth-box-footer">
            Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
        </div>
    </div>
</div>
{% endblock %}
